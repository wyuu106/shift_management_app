name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

# コードの読み取りだけ許可する。AWSの認証情報は渡さない
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      # 本番サーバー（Ubuntu 24.04）と同じメジャーバージョン
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # test_postgres.py はこの値があるときだけ実行される
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: python -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # tests/*.e2e.mjs は動いているサーバーが必要なため含めない
      - run: npm test
      - run: npm run build

  infra:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      # LegacyStackSynthesizerのため、AWSに接続せずにテンプレートを生成できる
      - run: npx cdk synth -q

  shell:
    runs-on: ubuntu-24.04
    env:
      # motdはログイン時に/bin/shで実行される
      MOTD: infra/server/motd/90-shift-management-backup
    steps:
      - uses: actions/checkout@v4
      - name: 文法チェック
        run: |
          for f in $(git ls-files '*.sh'); do bash -n "$f"; done
          sh -n "$MOTD"
      # lib/ops.shは読み込まれる側で#!がないため、シェルを明示する
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck --severity=warning --shell=bash $(git ls-files '*.sh')
          shellcheck --severity=warning "$MOTD"
