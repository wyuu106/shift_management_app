# api.example.com を実際のドメインに書き換えてから使う。
# HTTPSの設定（443番）は certbot --nginx が自動で追記する。

# ログインの総当たり対策。同じIPアドレスからのログインを1分あたり5回までにする。
# 事前確認（OPTIONS）は数えないよう、POSTのときだけIPアドレスをキーにする（キーが空なら制限しない）
map $request_method $login_limit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $login_limit_key zone=shift_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /login {
        # burst: 続けて5回までは待たせずに通し、それを超えた分を429で断る
        limit_req zone=shift_login burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @login_limited;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 画面がメッセージを表示できるよう、APIと同じdetail形式で返す。
    # この応答はFastAPIを通らないため、ブラウザが読めるようCORSのヘッダーをここで付ける
    location @login_limited {
        default_type application/json;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Vary Origin always;
        return 429 '{"detail":"ログインの試行回数が多すぎます。1分ほど待ってからやり直してください"}';
    }
}
